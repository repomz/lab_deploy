add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

client_max_body_size 20m;
limit_req_status 429;

error_page 429 = @rate_limited;
location @rate_limited {
  default_type application/json;
  return 429 '{"error":"Слишком много запросов. Подождите немного и повторите."}';
}

# Public health checks must prove that the API process and its MongoDB-backed
# startup completed. Do not serve the frontend SPA for these endpoints.
location = /health {
  proxy_pass http://backend:8080/health;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  add_header Cache-Control "no-store" always;
}

location = /api/health {
  proxy_pass http://backend:8080/health;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  add_header Cache-Control "no-store" always;
}

location = /api/v1/auth/login {
  limit_req zone=auth_limit burst=5 nodelay;
  proxy_pass http://frontend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
}

location = /api/v1/auth/register {
  limit_req zone=auth_limit burst=5 nodelay;
  proxy_pass http://frontend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
}

location = /api/v1/analyses {
  limit_req zone=ocr_limit burst=2 nodelay;
  proxy_pass http://frontend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 10s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
}

location ~ "^/api/v1/analyses/[0-9a-f]{24}/reprocess$" {
  limit_req zone=ocr_limit burst=2 nodelay;
  proxy_pass http://frontend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 10s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
}

# Role-specific entry points were removed in v0.10.0.
location ~ ^/(?:doc|patient)(?:/|$) {
  return 404;
}

location / {
  proxy_pass http://frontend:8080;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 10s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
}
