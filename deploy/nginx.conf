limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
map $request_method $ocr_limit_key {
  default "";
  POST $binary_remote_addr;
}
limit_req_zone $ocr_limit_key zone=ocr_limit:10m rate=6r/m;

server {
  listen 80;
  server_name 135.106.195.235;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name 135.106.195.235;

  ssl_certificate /etc/letsencrypt/live/135.106.195.235/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/135.106.195.235/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  client_max_body_size 20m;
  limit_req_status 429;

  error_page 429 = @rate_limited;
  location @rate_limited {
    default_type application/json;
    return 429 '{"error":"Слишком много запросов. Подождите немного и повторите."}';
  }

  location = /api/v1/auth/login {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://frontend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /api/v1/auth/register {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://frontend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /api/v1/analyses {
    limit_req zone=ocr_limit burst=2 nodelay;
    proxy_pass http://frontend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location ~ "^/api/v1/analyses/[0-9a-f]{24}/reprocess$" {
    limit_req zone=ocr_limit burst=2 nodelay;
    proxy_pass http://frontend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass http://frontend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }
}
