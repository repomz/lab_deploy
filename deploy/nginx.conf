limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
map $request_method $ocr_limit_key {
  default "";
  POST $binary_remote_addr;
}
limit_req_zone $ocr_limit_key zone=ocr_limit:10m rate=6r/m;

server {
  listen 80;
  server_name 135.106.195.235 ailab.su www.ailab.su;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 308 https://www.ailab.su$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name 135.106.195.235;

  ssl_certificate /etc/letsencrypt/live/135.106.195.235/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/135.106.195.235/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  return 308 https://www.ailab.su$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ailab.su;

  ssl_certificate /etc/letsencrypt/live/ailab.su/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ailab.su/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  return 308 https://www.ailab.su$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.ailab.su;

  ssl_certificate /etc/letsencrypt/live/ailab.su/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ailab.su/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  include /etc/nginx/snippets/app-locations.conf;
}
