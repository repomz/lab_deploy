services:
  mongo:
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 640m
    cpus: 0.75

  backend:
    build: !reset null
    image: ${BACKEND_IMAGE:-idrisovmarat/lab_back:latest}
    mem_limit: 640m
    cpus: 1.0

  frontend:
    build: !reset null
    image: ${FRONTEND_IMAGE:-idrisovmarat/lab_front:latest}
    ports: !reset []
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    cpus: 0.25

  gateway:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx:size=32m, /var/run:size=2m]
    security_opt: [no-new-privileges:true]
    networks: [private]

  certbot:
    image: certbot/certbot@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    profiles: [maintenance]
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
